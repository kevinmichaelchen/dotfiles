# Edit this source in ~/dotfiles; Herdr Settings writes to this symlink too.
onboarding = false

[theme]
name = "rose-pine"
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"

[update]
# Mise owns binary upgrades. Keep upstream agent detection fixes enabled.
version_check = false
manifest_check = true

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "agent", "state_text"], [{ token = "$hp_sub", dim = true }]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
# Visible without requesting macOS notification permissions.
delivery = "herdr"
delay_seconds = 2

[keys]
# Ctrl+B is reserved for tmux when Herdr runs inside it.
prefix = "ctrl+s"
next_agent = "prefix+]"
previous_agent = "prefix+["
# The default copy-mode binding uses [, so move it to avoid a collision.
copy_mode = "prefix+u"
focus_agent = "prefix+alt+1..9"
open_worktree = "prefix+alt+g"

[[keys.command]]
key = "prefix+alt+c"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin kevin.agents --entrypoint codex --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --focus'
description = "Codex subscription: new tab in this checkout"

[[keys.command]]
key = "prefix+alt+a"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin kevin.agents --entrypoint claude --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --focus'
description = "Claude subscription: new tab in this checkout"

[[keys.command]]
key = "prefix+alt+o"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin kevin.agents --entrypoint opencode --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --focus'
description = "OpenCode v2: new tab in this checkout"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "herdr-projects.open-popup"
description = "Projects coordinator and worker threads"

[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Review code and PR diffs"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate the terminal selection"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in the current folder"

[session]
resume_agents_on_restore = true

[experimental]
# Native agent transcripts already persist; don't duplicate terminal history.
pane_history = false
